<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram: Launch @Ritter_Official_bot</title>
    <style>
        body { background: linear-gradient(135deg, #e7f3eb 0%, #bce3c5 100%); font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #fff; width: 90%; max-width: 400px; border-radius: 20px; padding: 30px 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .avatar { width: 90px; height: 90px; background: #000; border-radius: 50%; margin: 0 auto 20px; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        h1 { font-size: 22px; margin: 0 0 5px; color: #000; }
        .username { color: #707579; font-size: 15px; margin-bottom: 25px; }
        .btn { background-color: #2481cc; color: #fff; border-radius: 20px; padding: 12px 0; width: 100%; font-size: 16px; font-weight: 600; text-decoration: none; display: block; text-transform: uppercase; margin-bottom: 15px; }
        .warning-box { background-color: #fff3f3; color: #d32f2f; border: 1px solid #ffcdd2; border-radius: 12px; padding: 12px; font-size: 13px; line-height: 1.4; font-weight: 500; }
        .footer-text { color: #707579; font-size: 13px; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar"><img src="logo.jpg" alt="Logo"></div>
        <h1>Ritter_Official_bot</h1>
        <div class="username">@Ritter_Official_bot</div>
        
        <a href="#" onclick="window.location.href='tg://resolve?domain=Ritter_Official_bot'; return false;" class="btn">Start Bot</a>
        
        <div class="warning-box">
            ⚠️ Если бот не открывается, нажмите <b>⋯</b> в правом верхнем углу и выберите «Открыть в браузере»
        </div>

        <div class="footer-text">If you have Telegram, you can launch Ritter_Official_bot right away.</div>
    </div>
</body>
</html>
